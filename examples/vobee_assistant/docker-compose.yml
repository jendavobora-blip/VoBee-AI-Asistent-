version: '3.8'

services:
  vobee-api:
    build:
      context: ../..  # Repository root
      dockerfile: examples/vobee_assistant/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
