# VoBee AI Assistant Configuration

[assistant]
name = "VoBee"
version = "0.1.0"

[learning]
# Enable learning from user interactions
enable_learning = true
# Track unrecognized queries for improvement
track_unrecognized = true

[storage]
# Enable persistent storage (future: SQLite)
enable_persistence = false
# Storage path (future implementation)
# database_path = "./vobee_data.db"

[ui]
# Window dimensions
window_width = 800
window_height = 600

